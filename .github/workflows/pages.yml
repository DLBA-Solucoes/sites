name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Cada pasta em sites/ vira /sites/<pasta>/ no Pages (o nome da pasta = nome do workspace npm).
      - name: Build de todos os sites
        env:
          SITE_URL: https://dlba-solucoes.github.io
          PUBLIC_NOINDEX: '1'
        run: |
          mkdir -p _site
          cp -r pages/. _site/
          for dir in sites/*/; do
            nome="$(basename "$dir")"
            echo "::group::$nome"
            BASE_PATH="/sites/$nome" npm run build -w "$nome"
            cp -r "${dir}dist" "_site/$nome"
            echo "::endgroup::"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
