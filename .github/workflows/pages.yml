name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build SC Máquinas
        run: npm run build -w sc-maquinas
        env:
          SITE_URL: https://dlba-solucoes.github.io
          BASE_PATH: /sites-cdl/sc-maquinas
          PUBLIC_NOINDEX: '1'
      - name: Montar o site
        run: |
          mkdir -p _site
          cp -r pages/. _site/
          cp -r sites/sc-maquinas/dist _site/sc-maquinas
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
